name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run validate
      # Build the JSON here too: it proves the export still works on every change,
      # and gives anyone a downloadable copy without waiting for a site deploy.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-json
          path: dist/dataset.json

  # A data change has to rebuild the site, but the site is already built and deployed by
  # Cloudflare's Git integration on every push to its repo. So rather than run a second, parallel
  # deploy from here - a second build path that can drift from the first - we write this dataset's
  # commit into the site repo and let its existing pipeline do the work.
  #
  # The file is also a pin: the site fetches exactly this commit, so a deploy is reproducible and
  # the site's history records which dataset every release carried.
  #
  # Needs SITE_DISPATCH_TOKEN: a fine-grained token on benln/lookmomnocloud, Contents read+write.
  # Absent, this warns rather than fails, so forks and pull requests stay green.
  notify-site:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Record this dataset version in the site repo
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set - the site will not rebuild by itself."
            exit 0
          fi
          git clone --quiet --depth 1 \
            "https://x-access-token:$TOKEN@github.com/benln/lookmomnocloud.git" site
          cd site
          echo "$GITHUB_SHA" > .data-version
          # Stage first: on the very first run the file is untracked, and `git diff` alone
          # would report no change and skip the commit that sets everything up.
          git add .data-version
          if git diff --cached --quiet; then
            echo "Site already pinned to $GITHUB_SHA - nothing to do."
            exit 0
          fi
          git config user.name "lookmomnocloud-data"
          git config user.email "noreply@lookmomnocloud.com"
          git commit --quiet -m "Rebuild against dataset ${GITHUB_SHA:0:7}"
          git push --quiet
          echo "Pinned the site to $GITHUB_SHA; Cloudflare will rebuild."
