# yaml-language-server: $schema=../../schema/device.schema.json
id: iegeek-ie80-h305r
brand: iegeek
model: IE80
hardware_revision: "h305r"
category: cameras

ha:
  integration: null
  works_with_ha_certified: false
  route: after-flash
  cloud_needed: never
  guide_url: https://github.com/roleoroleo/yi-hack-MStar
  source: https://github.com/roleoroleo/yi-hack-MStar
  verified_on: 2026-09-22
  notes: >-
    No core integration for the camera as sold. Once yi-hack-MStar is on the SD card the
    camera speaks RTSP, ONVIF and MQTT, so Home Assistant's ONVIF integration (Local Push),
    generic camera and MQTT integration (Local Push) pick it up with no vendor login; the
    project also ships a HACS component
    (https://github.com/roleoroleo/yi-hack_ha_integration) built on MQTT. Home Assistant's
    legacy core `yi` integration (local_polling, FTP based) only works with the hacked
    firmware too, so nothing here applies before flashing.

criteria:
  works_offline:
    value: unknown
    notes: >-
      No vendor documentation found for this camera's behaviour with the WAN cut; the
      yi-hack README only describes it after flashing.

  no_account_required:
    value: unknown
    notes: >-
      No vendor documentation found on whether setup needs an account.

  local_api:
    value: unknown
    notes: >-
      No vendor documentation found for a local protocol on the stock firmware.

  cloud_blockable:
    value: unknown
    notes: >-
      No vendor documentation found on whether the camera survives being firewalled.

  local_firmware_updates:
    value: unknown
    notes: >-
      No vendor documentation found on how the stock firmware is updated.

  alternative_firmware:
    value: true
    source: https://github.com/roleoroleo/yi-hack-MStar
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Listed as "IE80" with file prefix h305r in the yi-hack-MStar supported-cameras table.

  ha_local_integration:
    value: unknown
    notes: >-
      No core integration talks to the stock firmware and no ONVIF/RTSP/MQTT is documented
      as sold; the core `yi` integration is local_polling but requires the custom firmware.
      See the ha block for what flashing buys.

flashing:
  supported: true
  firmwares: [yi-hack]
  method: sd-card
  requires_soldering: false
  difficulty: easy
  reversible: null
  guide_url: https://github.com/roleoroleo/yi-hack-MStar
  guide_is_ours: false
  tier_after_flash: fully-local
  source: https://github.com/roleoroleo/yi-hack-MStar
  verified_on: 2026-09-22
  notes: >-
    Covered by yi-hack-MStar (https://github.com/roleoroleo/yi-hack-MStar): firmware 8.0.0.
    The README marks this model Experimental. This is a third-party camera that happens to
    run the same MStar platform as the Yi cameras; the as-sold criteria could not be sourced
    from ieGeek. Install: format the SD card FAT32, unpack the release for your model onto
    it, insert and reboot. The README lists RTSP, ONVIF and MQTT servers and "the
    possibility to disable all the cloud features", so the hacked camera can run with no Yi
    account or cloud. The README warns that this firmware completely overwrites the original
    firmware; going back needs the backup of the stock partitions the wiki tells you to dump
    first, so we do not call it reversible.

offers: []

notes: >-
  As sold the IE80 is a vendor-app camera and we could not find any vendor statement about
  what it does without its cloud, so the verdict stays unverified. The way out is a microSD
  card: yi-hack-MStar runs on it because it shares the Yi cameras' chip, and once installed
  the camera exposes RTSP, ONVIF and MQTT and the cloud can be switched off. Check the file
  prefix (h305r) against the project's table before flashing.
