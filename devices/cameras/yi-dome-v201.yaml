# yaml-language-server: $schema=../../schema/device.schema.json
id: yi-dome-v201
brand: yi
model: Dome 720p
hardware_revision: "v201"
category: cameras

ha:
  integration: null
  works_with_ha_certified: false
  route: after-flash
  cloud_needed: never
  guide_url: https://github.com/alienatedsec/yi-hack-v5
  source: https://github.com/alienatedsec/yi-hack-v5
  verified_on: 2026-09-22
  notes: >-
    No core integration for the camera as sold. Once yi-hack-v5 is on the camera it speaks
    RTSP (free in alienatedsec's fork; TheCrypt0's yi-hack-v4 keeps RTSP for supporters),
    ONVIF and MQTT, so Home Assistant's ONVIF integration (Local Push), generic camera and
    MQTT integration (Local Push) pick it up with no vendor login. Home Assistant's legacy
    core `yi` integration (local_polling, FTP based) only works with the hacked firmware
    too, so nothing here applies before flashing.

criteria:
  works_offline:
    value: unknown
    notes: >-
      Yi's help centre (help.yitechnology.com) now renders as an empty single-page app and
      the articles on offline behaviour could not be opened, so we do not assert what the
      stock firmware does without the WAN. Verify: cut the WAN and check whether the YI Home
      / Kami Home app still reaches the camera on the LAN and whether SD recording
      continues.

  no_account_required:
    value: unknown
    notes: >-
      Yi's product page says to download the YI Home app and connect the device, and its own
      manuals mention registering a YI account, but the account-creation help article could
      not be opened, so this stays unknown. Verify: try to pair the camera in the YI Home /
      Kami Home app without signing in.

  local_api:
    value: unknown
    notes: >-
      Yi's help-centre article "Does the camera support RTSP or ONVIF?"
      (help.yitechnology.com article 360035242994) could not be opened, so we do not assert
      the answer. A Kami staff member on the community forum writes that the YI app does not
      support RTSP (https://forum.yitechnology.com/t/onvif-and-rtsp/3028), which is not a
      statement about the firmware.

  cloud_blockable:
    value: unknown
    notes: >-
      No vendor statement found on what happens when the camera is firewalled from Yi's
      servers. Verify: block WAN for a week and check live view, alerts and settings.

  local_firmware_updates:
    value: unknown
    notes: >-
      Yi documents firmware updates through the app (help-centre article "Check available
      firmware update of your camera"), but the article could not be opened and we found no
      statement on manual or forced updates.

  alternative_firmware:
    value: true
    source: https://github.com/alienatedsec/yi-hack-v5
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Listed as "Yi Dome 720p" with file prefix v201 in the yi-hack-v5 (alienatedsec)
      supported-cameras table.

  ha_local_integration:
    value: unknown
    notes: >-
      No core integration talks to the stock firmware and no ONVIF/RTSP/MQTT is documented
      as sold; the core `yi` integration is local_polling but requires the custom firmware.
      See the ha block for what flashing buys.

flashing:
  supported: true
  firmwares: [yi-hack]
  method: sd-card
  requires_soldering: false
  difficulty: easy
  reversible: null
  guide_url: https://github.com/alienatedsec/yi-hack-v5
  guide_is_ours: false
  tier_after_flash: fully-local
  source: https://github.com/alienatedsec/yi-hack-v5
  verified_on: 2026-09-22
  notes: >-
    Covered by yi-hack-v5 (alienatedsec) (https://github.com/alienatedsec/yi-hack-v5): the
    720p Yi Dome (files rootfs_v201 / home_v201, base firmware 1.9.1.0J). Also listed by
    TheCrypt0's yi-hack-v4. Install: format the SD card FAT32, copy rootfs_xx, home_xx and
    the yi-hack-v5 folder onto it, insert and power on; the firmware is written to the
    camera's flash. The README lists an RTSP server, MQTT and "the possibility to disable
    all the cloud features while keeping the RTSP stream", so the hacked camera can run with
    no Yi account or cloud. The firmware is written to the camera's internal flash from the
    SD card (rootfs and home partitions); neither README documents a way back to stock, so
    reversibility is left open.

offers: []

notes: >-
  As sold the Yi Dome 720p is driven entirely by the YI Home / Kami Home app and Yi's cloud,
  and Yi's help centre could not be opened to confirm what survives without it, so the
  verdict stays unverified rather than guessed. The way out is a microSD card: yi-hack-v5
  (alienatedsec) replaces the stock firmware and adds RTSP, ONVIF and MQTT, lets you switch
  the cloud off, and Home Assistant then talks to the camera directly. Match the file prefix
  (v201) and your serial-number prefix to the project's table before you flash, because the
  same box ships with several different chips.
