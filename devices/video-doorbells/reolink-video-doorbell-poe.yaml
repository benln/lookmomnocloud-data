# yaml-language-server: $schema=../../schema/device.schema.json
id: reolink-video-doorbell-poe
brand: reolink
model: Video Doorbell PoE
hardware_revision: null
category: video-doorbells
product_url: https://reolink.com/product/reolink-video-doorbell-poe/

ha:
  integration: reolink
  works_with_ha_certified: false
  route: core
  cloud_needed: never
  guide_url: https://www.home-assistant.io/integrations/reolink/
  source: https://www.home-assistant.io/integrations/reolink/
  verified_on: 2026-09-22
  notes: >-
    Same local integration as Reolink cameras: device credentials, no cloud account, keeps
    working with internet blocked. The PoE doorbell is on the tested list; only the Wi-Fi
    and battery doorbells carry the Works with Home Assistant certification.

criteria:
  works_offline:
    value: true
    source: https://reolink.com/product/reolink-video-doorbell-poe/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Reolink's product FAQ says that without an internet connection the doorbell still
      detects motion/people and records to the SD card, but cannot send alerts to phones.

  no_account_required:
    value: true
    source: https://support.reolink.com/articles/29100983585177-Reolink-Account-FAQ/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Reolink's account FAQ says a Reolink account is only needed for cloud storage and
      smart-home features, not to configure and use the device.

  local_api:
    value: true
    source: https://support.reolink.com/articles/900000617826-Which-Reolink-Products-Support-CGI-RTSP-ONVIF/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Reolink's protocol table lists the Doorbell PoE with CGI, RTSP and ONVIF supported
      standalone; the product page also lists RTSP, RTMP and ONVIF.

  cloud_blockable:
    value: true
    source: https://www.home-assistant.io/integrations/reolink/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      The Home Assistant docs state that when internet access is blocked for Reolink
      devices, the integration and the Reolink app/client continue to work as usual.

  local_firmware_updates:
    value: true
    source: https://support.reolink.com/articles/34817575507481-How-to-Manually-Update-Firmware-for-Reolink-Devices/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Manual .pak upload through the web UI or desktop client under System > Maintenance >
      Firmware Update; auto-update is an opt-in setting.

  alternative_firmware:
    value: false
    source: https://github.com/OpenIPC/wiki/blob/master/en/guide-supported-devices.md
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: Not on OpenIPC's supported-devices list nor on Thingino's camera list.

  ha_local_integration:
    value: true
    source: https://github.com/home-assistant/core/blob/dev/homeassistant/components/reolink/manifest.json
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: 'iot_class: local_push'

flashing:
  supported: false
  notes: No OpenIPC or Thingino port is listed for this doorbell.

offers: []

notes: >-
  With the internet gone the doorbell still rings its chime, detects people and records
  to its microSD card or a Reolink NVR, and its RTSP/ONVIF stream keeps feeding whatever
  you point at it. What you lose is the phone notification and answering from outside
  the house. No Reolink account is needed; firmware is a .pak file you upload yourself.
