# yaml-language-server: $schema=../../schema/device.schema.json
id: roborock-s7
brand: roborock
model: S7
hardware_revision: null
category: robot-vacuums
released: 2021
product_url: https://us.roborock.com/pages/roborock-s7

ha:
  integration: roborock
  works_with_ha_certified: false
  route: core
  cloud_needed: always
  guide_url: https://www.home-assistant.io/integrations/roborock/
  source: https://www.home-assistant.io/integrations/roborock/
  verified_on: 2026-09-22
  notes: >-
    Setup needs a Roborock account; commands and polling then go to the robot directly, but the
    docs say cloud access is still required for it to work: maps and routines are always fetched
    through the cloud, and the robot blocks its local API whenever it cannot reach Roborock's servers.

criteria:
  works_offline:
    value: true
    source: https://support.roborock.com/hc/en-us/articles/360030815691-Can-robot-cleaner-work-without-Wi-Fi
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Roborock's FAQ, which lists the S7, says it does full-home and spot cleanups and returns to
      the dock by button without Wi-Fi; scheduled cleaning and suction selection need the app.
  no_account_required:
    value: false
    source: https://www.home-assistant.io/integrations/roborock/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      The prerequisites are to install the Roborock app, "create an account and log in" and add
      the robot there; Roborock's own S7-specific setup article was not found.
  local_api:
    value: true
    source: https://www.home-assistant.io/integrations/roborock/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      Home Assistant "uses local communication for commands and polling"; the protocol is the
      reverse-engineered python-roborock one, not something Roborock publishes.
  cloud_blockable:
    value: false
    source: https://www.home-assistant.io/integrations/roborock/
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      "When the vacuum is disconnected from the internet, it blocks its local API until it can
      reach the Roborock servers."
  local_firmware_updates:
    value: unknown
    notes: >-
      Roborock only documents firmware updates through the Roborock or Mi Home app, and the one
      article found covers the S6 MaxV; no S7-specific statement, and no local update path, found.
  alternative_firmware:
    value: true
    source: https://valetudo.cloud/pages/general/supported-robots/
    verified_on: 2026-09-21
    confidence: vendor_documented
    notes: Listed as supported by Valetudo.
  ha_local_integration:
    value: true
    source: https://github.com/home-assistant/core/blob/dev/homeassistant/components/roborock/manifest.json
    verified_on: 2026-09-22
    confidence: vendor_documented
    notes: >-
      iot_class is local_polling, and the same docs warn that cloud access is still required.

flashing:
  supported: true
  firmwares: [valetudo]
  method: fel
  guide_url: https://valetudo.cloud/pages/general/supported-robots/
  guide_is_ours: false
  tier_after_flash: fully-local
  source: https://valetudo.cloud/pages/general/supported-robots/
  verified_on: 2026-09-21
  notes: >-
    Rooting voids the warranty and can brick the robot. Valetudo documents the procedure per model
    and keeps it current. Valetudo warns the S7's VibraRise mop module makes disassembly easy to
    get wrong.

offers: []

notes: >-
  Cut the internet and the S7 still cleans, spot-cleans and docks from its buttons, but the app,
  schedules and every local integration go dark: the robot refuses local commands until it can
  reach Roborock again. The account is mandatory to pair it at all. The way out is Valetudo, which
  replaces the cloud entirely but requires a full teardown that Valetudo itself flags as tricky.
